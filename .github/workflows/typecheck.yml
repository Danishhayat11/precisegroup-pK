# TypeScript typecheck — runs `tsgo --noEmit` across the whole project on
# every pull request and every push to main. Fails the build on ANY TS
# error, which includes:
#   • TS7016 — missing declarations for third-party modules (regression
#     sentinel for the `webpush-webcrypto` shim under `src/types/`).
#   • TS2307 — module not found (unresolved local or npm imports).
#   • All other strict-mode errors surfaced by `tsconfig.json`.
#
# Uses `tsgo` (the Go-based TS compiler) for speed; behavior matches
# `tsc --noEmit` for diagnostics.
name: typecheck

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "tsconfig*.json"
      - "package.json"
      - "bun.lockb"
      - ".github/workflows/typecheck.yml"
  push:
    branches: [main]

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tsgo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tsgo --noEmit
        run: bun run typecheck
