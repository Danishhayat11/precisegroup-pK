# Visual regression — mobile primitives (StatusBadge / EmptyState /
# Skeleton / CRM header / Bookings FAB).
#
# On every PR and every push to main:
#   1. Run the mobile-primitives Playwright suite. Playwright writes
#      expected/actual/diff PNGs into `test-results/` whenever a
#      screenshot assertion fails.
#   2. Regardless of pass/fail, run `visual-diff-report` — it composes
#      each failing triple into a single **expected | actual | diff**
#      triptych PNG and writes a self-contained HTML index.
#   3. Upload the report + full Playwright HTML report + raw
#      test-results as CI artifacts.
#   4. Publish the triptychs inline in the workflow-run **Summary** so
#      reviewers see every regression on GitHub without downloading
#      anything.
#   5. Post a sticky PR comment linking to the run so reviewers land
#      on the summary and artifacts in one click.
name: visual-mobile-primitives

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/visual/mobile-primitives.spec.ts"
      - "tests/visual/mobile-primitives.spec.ts-snapshots/**"
      - "tests/visual/tablet-erp-primitives.spec.ts"
      - "tests/visual/tablet-erp-primitives.spec.ts-snapshots/**"
      - "tests/visual/thresholds.config.json"
      - "tests/visual/_thresholds.ts"
      - "scripts/visual-diff-report.mjs"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lockb"
      - ".github/workflows/visual-mobile-primitives.yml"
  push:
    branches: [main]

concurrency:
  group: visual-mobile-primitives-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ── Cache: bun install dir ─────────────────────────────────────────
      # Keyed on bun.lock + package.json. A hit skips the network-heavy
      # `bun install` and just links from the cache. Miss re-populates
      # the cache on green runs of main.
      - name: Cache bun install (node_modules + ~/.bun/install/cache)
        id: cache-bun
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        # `--frozen-lockfile` is a no-op when node_modules is cache-hit,
        # but we still run it so newly-added deps land + postinstalls fire.
        run: bun install --frozen-lockfile

      # ── Cache: Playwright browsers ─────────────────────────────────────
      # `~/.cache/ms-playwright` holds the Chromium build Playwright
      # downloads. Cache key MUST include the resolved @playwright/test
      # version — a browser bundle from an older Playwright is
      # incompatible and will `Executable doesn't exist` at runtime.
      # We read the resolved version from bun.lock via `bun pm ls` so a
      # ^-bump in package.json still gets a fresh cache once installed.
      - name: Resolve Playwright version
        id: pw-version
        run: |
          v="$(bun pm ls 2>/dev/null | grep -oE '@playwright/test@[^ ]+' | head -n1 | cut -d@ -f3)"
          if [ -z "$v" ]; then
            v="$(node -p "require('./package.json').devDependencies['@playwright/test'] || require('./package.json').dependencies['@playwright/test']" | tr -d '^~')"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Resolved @playwright/test version: $v"

      - name: Cache Playwright browsers (~/.cache/ms-playwright)
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}-chromium
          # No restore-keys: a partial-version match risks browser/host
          # ABI mismatch (see above). Full hit or fresh install, nothing
          # in between.

      - name: Install Playwright Chromium (binaries only, on cache miss)
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      - name: Install Playwright system deps (always — apt state isn't cached)
        # `--with-deps` on the binary install above would re-download
        # Chromium even on a cache hit. Split into two calls: the
        # cached binary + the ~10-second apt install of shared libs.
        run: bunx playwright install-deps chromium

      - name: Run mobile-primitives visual suite
        id: visual
        env:
          CI: "true"
        # Do not fail the job on screenshot mismatch — we still want the
        # diff-report + artifact upload steps to run. The final "Fail
        # the job" step below re-asserts the outcome so the check turns
        # red when there are diffs. Both mobile and tablet suites feed
        # the SAME `test-results/` directory, so the diff-report step
        # captures every failing snapshot in one pass.
        run: |
          set +e
          bun run test:visual:mobile-primitives
          mobile=$?
          bun run test:visual:tablet-erp
          tablet=$?
          if [ "$mobile" -ne 0 ] || [ "$tablet" -ne 0 ]; then
            echo "outcome=1" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=0" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Generate visual-diff report (with PR annotations)
        # Runs unconditionally so the report + inline `::error file=…`
        # workflow-command annotations render even when Playwright fails.
        # `GITHUB_ACTIONS=true` is set automatically by the runner, so
        # the script auto-enables its `--annotate` path; passing the
        # flag explicitly makes the intent obvious in the log.
        if: always()
        run: bun run test:visual:diff-report -- --annotate true

      - name: Upload visual-diff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-report
          path: visual-diff-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload raw test-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: visual-mobile-primitives
          message: |
            ### Visual regression — mobile primitives

            ${{ steps.visual.outputs.outcome == '0' && '✅ All baselines match.' || '❌ Screenshot diffs detected — expand the **Summary** on the run page to see every EXPECTED | ACTUAL | DIFF triptych inline.' }}

            - **Run summary + inline diffs:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - **Downloadable HTML report:** `visual-diff-report` artifact (open `index.html`)
            - **Full Playwright report:** `playwright-report` artifact

            To accept intentional visual changes, run `bun run test:visual:mobile-primitives:update` locally and commit the updated snapshots under `tests/visual/mobile-primitives.spec.ts-snapshots/`.

      - name: Fail the job if the visual suite failed
        if: always() && steps.visual.outputs.outcome != '0'
        run: |
          echo "::error::mobile-primitives visual suite reported diffs. See the Summary above and the visual-diff-report artifact."
          exit 1
