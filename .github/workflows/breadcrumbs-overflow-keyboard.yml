name: Breadcrumbs overflow keyboard (cross-browser)

# Runs the overflow-trigger keyboard contract (Tab → Space/Enter opens
# menu, aria-expanded flips, Escape restores focus) on BOTH chromium and
# webkit. WebKit is where menu-button activator quirks and :focus-visible
# semantics diverge from Chromium, so keeping this spec green on webkit
# is a nightly gate — not blocked on PRs to keep turnaround fast.

on:
  schedule:
    - cron: "35 5 * * *" # nightly, staggered from other suites
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "tests/visual/breadcrumbs-overflow-keyboard.spec.ts"
      - "src/components/**/Breadcrumb*"
      - "src/components/ui/breadcrumb*"
      - "src/components/ui/dropdown-menu*"
      - "playwright.config.ts"
      - ".github/workflows/breadcrumbs-overflow-keyboard.yml"

concurrency:
  group: overflow-kb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  overflow-keyboard:
    name: overflow-keyboard (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-reduced-motion
            browser: chromium
          - project: webkit-reduced-motion
            browser: webkit
    env:
      CI: "true"
      BASE_URL: http://localhost:8080
      FORCE_COLOR: "1"
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

    steps:
      - name: Validate required environment variables
        run: |
          missing=()
          [ -n "$VITE_SUPABASE_URL" ] || missing+=("VITE_SUPABASE_URL")
          [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ] || missing+=("VITE_SUPABASE_PUBLISHABLE_KEY")
          [ -n "$VITE_SUPABASE_PROJECT_ID" ] || missing+=("VITE_SUPABASE_PROJECT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repository secrets: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        id: bun-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        if: steps.bun-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      # Cache Vite's on-disk prebundle + transform cache so repeated
      # Playwright runs skip redundant esbuild/Rollup work when deps and
      # vite config are unchanged. Keyed on lockfile + vite config hash.
      - name: Cache Vite build artifacts
        uses: actions/cache@v4
        id: vite-cache
        with:
          path: |
            node_modules/.vite
            .vite
            .tanstack
          key: ${{ runner.os }}-vite-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json', 'vite.config.ts', 'vite.config.js', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-
      - name: Report Vite cache status
        shell: bash
        run: |
          set -u
          hit='${{ steps.vite-cache.outputs.cache-hit }}'
          if [ "$hit" = "true" ]; then status="HIT"; else status="MISS"; fi
          size="(not present)"
          for d in node_modules/.vite .vite .tanstack; do
            if [ -d "$d" ]; then
              s=$(du -sh "$d" 2>/dev/null | cut -f1)
              size="${d}=${s}${size:+ }${size}"
            fi
          done
          echo "::group::Vite build cache"
          echo "status: $status"
          echo "sizes : $size"
          echo "::endgroup::"
          {
            echo "### Vite build cache"
            echo ""
            echo "| Status | Sizes |"
            echo "| --- | --- |"
            echo "| **$status** | $size |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Per-browser Playwright cache — sharing one cache across browsers
      # invalidates every time we bump either revision, doubling install time.
      - name: Cache Playwright browser (${{ matrix.browser }})
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ matrix.browser }}-
            ${{ runner.os }}-playwright-

      - name: Report Playwright cache status
        shell: bash
        run: |
          set -u
          hit='${{ steps.playwright-cache.outputs.cache-hit }}'
          key='${{ steps.playwright-cache.outputs.cache-primary-key }}'
          matched='${{ steps.playwright-cache.outputs.cache-matched-key }}'
          if [ "$hit" = "true" ]; then status="HIT"; else status="MISS"; fi
          size="(not present)"
          if [ -d "$HOME/.cache/ms-playwright" ]; then
            size=$(du -sh "$HOME/.cache/ms-playwright" 2>/dev/null | cut -f1)
          fi
          echo "::group::Playwright browser cache"
          echo "status      : $status"
          echo "primary key : $key"
          echo "matched key : ${matched:-<none>}"
          echo "cache size  : $size"
          echo "::endgroup::"
          {
            echo "### Playwright browser cache"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Status | **$status** |"
            echo "| Primary key | \`$key\` |"
            echo "| Matched key | \`${matched:-<none>}\` |"
            echo "| Cache dir size | $size |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Playwright browser (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          echo "::group::Playwright install — Install Playwright browser (cache miss)"
          start=$SECONDS
          bunx playwright install --with-deps ${{ matrix.browser }}
          elapsed=$(( SECONDS - start ))
          echo "install elapsed: ${elapsed}s"
          echo "::endgroup::"
          echo "- **Install Playwright browser (cache miss)** — ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          echo "::group::Playwright install — Install Playwright system deps (cache hit)"
          start=$SECONDS
          bunx playwright install-deps ${{ matrix.browser }}
          elapsed=$(( SECONDS - start ))
          echo "install elapsed: ${elapsed}s"
          echo "::endgroup::"
          echo "- **Install Playwright system deps (cache hit)** — ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Playwright system deps
        run: bash .github/scripts/validate-playwright-apt-deps.sh ${{ matrix.browser }}

      - name: Print tool versions
        run: |
          echo "::group::Versions"
          bun --version
          bunx playwright --version
          node --version || true
          echo "::endgroup::"

      - name: Run overflow keyboard spec (${{ matrix.project }})
        run: |
          bunx playwright test tests/visual/breadcrumbs-overflow-keyboard.spec.ts \
            --project=${{ matrix.project }} \
            --retries=1 \
            --reporter=list,html \
            --output=test-results

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overflow-kb-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload traces & failure snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: overflow-kb-traces-${{ matrix.project }}
          path: |
            test-results/**/trace.zip
            test-results/**/*.png
            test-results/**/*.webm
          retention-days: 14
          if-no-files-found: ignore
