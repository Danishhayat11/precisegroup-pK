<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Offline — Precise ERP</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #f5f5f7;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Display",
          "Inter",
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
      }
      .logo {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        background: #0a0a0a;
        border: 1px solid rgba(255, 255, 255, 0.08);
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 6px;
        letter-spacing: -0.01em;
      }
      .brand {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #a1a1aa;
        margin-bottom: 24px;
      }
      p {
        color: #a1a1aa;
        font-size: 15px;
        line-height: 1.5;
        margin: 8px 0;
      }
      .sync {
        font-size: 13px;
        color: #71717a;
        margin-top: 4px;
      }
      ul {
        text-align: left;
        color: #d4d4d8;
        font-size: 14px;
        padding-left: 18px;
        margin: 20px 0;
      }
      ul li {
        margin: 6px 0;
      }
      button {
        margin-top: 20px;
        width: 100%;
        padding: 14px 20px;
        border-radius: 12px;
        border: 0;
        background: #ffffff;
        color: #000;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.98);
      }
      .status {
        margin-top: 10px;
        font-size: 13px;
        color: #71717a;
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo"><img src="/icons/icon-192.png" alt="Precise ERP" /></div>
      <div class="brand">Precise Realtors &amp; Builders</div>
      <h1>You are offline</h1>
      <p>No internet connection right now. You can still view data that was previously loaded.</p>
      <p class="sync" id="lastSync">Last synced: —</p>
      <ul>
        <li>View previously loaded dashboards and lists</li>
        <li>Draft actions will sync when you're back online</li>
      </ul>
      <button id="retry" type="button">Retry connection</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </div>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("precise:lastSyncedAt");
          if (t) {
            var d = new Date(Number(t));
            if (!isNaN(d.getTime()))
              document.getElementById("lastSync").textContent =
                "Last synced: " + d.toLocaleString();
          }
        } catch (_) {}
        var btn = document.getElementById("retry");
        var status = document.getElementById("status");
        btn.addEventListener("click", function () {
          status.textContent = "Checking connection…";
          fetch("/?_probe=" + Date.now(), { cache: "no-store" })
            .then(function (r) {
              if (r.ok) location.reload();
              else status.textContent = "Still offline. Try again.";
            })
            .catch(function () {
              status.textContent = "Still offline. Try again.";
            });
        });
        window.addEventListener("online", function () {
          location.reload();
        });
      })();
    </script>
  </body>
</html>
